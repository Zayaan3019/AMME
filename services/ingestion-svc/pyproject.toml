[project]
name = "ingestion-svc"
version = "0.1.0"
description = "AMME ingestion-svc"
requires-python = ">=3.11"
dependencies = [
    "amme-shared",
    "aiohttp>=3.9",
    "websockets>=13.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["ingestion_svc"]
