[project]
name = "deeplob-inference-svc"
version = "0.1.0"
description = "AMME deeplob-inference-svc"
requires-python = ">=3.11"
dependencies = [
    "amme-shared",
    "torch>=2.2",
    "onnxruntime>=1.18",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["deeplob_inference_svc"]
