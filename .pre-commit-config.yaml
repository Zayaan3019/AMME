# Fast checks only. Anything slower than a couple of seconds belongs in CI --
# a pre-commit hook that makes committing painful gets bypassed with --no-verify,
# and a bypassed hook protects nothing.
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.4
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: check-toml
      - id: check-added-large-files
        args: [--maxkb=2048]
      - id: check-merge-conflict
      # PowerShell 5.1's Set-Content -Encoding utf8 writes a BOM, which breaks
      # ast.parse and several tools. Caught the hard way; now blocked at commit.
      - id: fix-byte-order-marker
      - id: mixed-line-ending
        args: [--fix=lf]

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.18.2
    hooks:
      - id: mypy
        files: ^shared/
        additional_dependencies: [pydantic>=2.8, pydantic-settings>=2.4, numpy>=1.26]
        args: [--ignore-missing-imports]
