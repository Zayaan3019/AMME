[project]
name = "amme-shared"
version = "0.1.0"
description = "AMME shared event contracts, transport, and pure quant/ML core"
requires-python = ">=3.11"

dependencies = [
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "typing-extensions>=4.12",
    "numpy>=1.26",
    "redis>=5.0",
    "asyncpg>=0.29",
    "structlog>=24.1",
    "prometheus-client>=0.20",
    "fastapi>=0.112",
    "uvicorn[standard]>=0.30",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
# Two packages, one distribution. `amme_core` is deliberately dependency-light
# (numpy only) so the backtester and the training pipeline can import the exact
# same strategy code without dragging in redis/fastapi.
packages = ["amme_shared", "amme_core"]
